name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      # apps/api/dev-scripts/ (manual-only diagnostics: smoke tests,
      # retrieval-quality-check, generate-schema-check, check-transactions,
      # the latency probe) are excluded from the production build entirely
      # (tsconfig.build.json) so they never need to compile as part of the
      # Docker image - see docs/learning-notes.md for the real CI failure
      # that caused this split. Built here, separately, so they can never
      # silently rot: a broken import or type error in one of these still
      # fails CI, just without touching the production build at all.
      - name: Build dev scripts
        run: pnpm --filter @supportpilot/api run build:dev-scripts

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Test
        run: pnpm -r run test

      # Validates both profiles' merged config is well-formed - no
      # containers started, no build. The demo profile's own vars resolve
      # against the committed, placeholder-only .env.demo.example (never a
      # real secret) since this step only checks structure, never actually
      # connects to anything.
      - name: Validate docker compose config (default profile)
        run: docker compose config --quiet

      - name: Validate docker compose config (demo profile)
        run: docker compose --profile demo --env-file .env.demo.example config --quiet

      - name: Docker Compose build
        run: docker compose build

      - name: Docker Compose up
        run: docker compose up -d

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API to become healthy... (attempt $i)"
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Docker Compose logs
        if: always()
        run: docker compose logs

      - name: Docker Compose ps
        if: always()
        run: docker compose ps -a

      - name: Docker Compose down
        if: always()
        run: docker compose down

      # Built independently of docker-compose.yml (not just relying on the
      # fact that compose happens to set no DB/LLM vars today) so this keeps
      # proving the app boots and answers /health with NO database and NO
      # LLM key configured, even if docker-compose.yml itself changes later.
      - name: Build image for the no-env boot check
        run: docker build -t supportpilot-api-no-env -f apps/api/Dockerfile .

      - name: Boot with no database/Gemini env vars and check /health
        run: |
          docker run -d --name supportpilot-api-no-env -p 3001:3000 -e API_PORT=3000 supportpilot-api-no-env
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then
              echo "API is healthy with no MONGODB_URI/GEMINI_API_KEY set"
              exit 0
            fi
            echo "Waiting for API to become healthy... (attempt $i)"
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: No-env container logs
        if: always()
        run: docker logs supportpilot-api-no-env || true

      - name: No-env container cleanup
        if: always()
        run: docker rm -f supportpilot-api-no-env || true

  integration-tests:
    runs-on: ubuntu-latest
    # Backstop so a genuine hang (e.g. the TENANT_BUSY deadlock this job
    # actually hit once, before being fixed - see docs/learning-notes.md)
    # cannot silently burn through free CI minutes. Raised from 15 to 20
    # minutes for Stage 6 (chat.integration-spec.ts and its three
    # neighbors, 11 spec files total now, up from 7) - chat-limits.
    # integration-spec.ts alone boots roughly a dozen separate NestJS
    # TestingModule instances (one per rate-limit/budget/cap concern, each
    # needing its own tiny env override - see that file's own doc comment
    # for why). No real CI run of these four files exists yet to measure
    # against, so this number is a considered estimate, not observed
    # reality the way the old 15-minute figure was - revisit once a real
    # run's actual duration is known (see docs/learning-notes.md).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Build
        timeout-minutes: 5
        run: pnpm -r run build

      # Pinned to a specific build (not :latest or :8.0), confirmed directly
      # against MongoDB's own docs and Docker Hub (not assumed) - see
      # docs/learning-notes.md's Stage 7 entry. Runs as a single-node
      # replica set internally, which is what makes multi-document
      # transactions AND Atlas Vector Search both work in it, the same as
      # real Atlas - this is the only reason it's usable for this project's
      # integration suite at all, not just a generic "local mongo" stand-in.
      - name: Start MongoDB Atlas Local
        run: |
          docker run -d --name atlas-local -p 27017:27017 mongodb/mongodb-atlas-local:8.0.20-20261027T181252Z

      - name: Wait for Atlas Local to report healthy
        # The loop below is already self-bounded to 60 * 2s = 2 minutes;
        # this is a backstop in case the loop itself ever misbehaves.
        timeout-minutes: 3
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' atlas-local 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Atlas Local is healthy"
              exit 0
            fi
            echo "Waiting for Atlas Local to become healthy... (attempt $i, status: $status)"
            sleep 2
          done
          echo "Atlas Local did not become healthy in time"
          exit 1

      - name: Run integration tests
        # The real risk step - covers globalSetup's index-queryable wait
        # (up to 2 min) plus all 11 spec files' own work (7 pre-Stage-6
        # files, whose slowest observed real run was well under 5 minutes
        # end to end, plus Stage 6's four chat-*.integration-spec.ts files,
        # which boot considerably more separate app instances than any
        # prior file - see chat-limits.integration-spec.ts's own doc
        # comment). Raised from 10 to 15 minutes as an estimate pending a
        # real CI run's actual duration (update this comment with the real
        # number once one exists, per docs/learning-notes.md).
        timeout-minutes: 15
        env:
          # directConnection=true is required - Atlas Local runs as a
          # single-node replica set, and without it the driver's topology
          # discovery can behave unexpectedly against a single host
          # (documented by MongoDB, see docs/learning-notes.md).
          MONGODB_TEST_URI: "mongodb://localhost:27017/test_ci?directConnection=true"
        run: pnpm --filter @supportpilot/api run test:integration

      - name: Atlas Local container logs
        if: always()
        run: docker logs atlas-local || true

      - name: Atlas Local cleanup
        if: always()
        run: docker rm -f atlas-local || true
